name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check Worker deployment
        run: pnpm -F @has-a-computer/worker run deploy --dry-run

      - name: Knip
        run: pnpm knip

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Audit
        run: pnpm audit --audit-level high

      - name: Upload website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: packages/www/dist
          include-hidden-files: true
          retention-days: 1

  deploy-pages:
    name: Deploy website
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    steps:
      - name: Check out website deployment repo
        uses: actions/checkout@v7
        with:
          repository: aspizu/has-a.computer-pages
          ref: main
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: site

      - name: Download website
        uses: actions/download-artifact@v8
        with:
          name: website
          path: site-build

      - name: Publish website
        working-directory: site
        run: |
          rsync -a --delete --exclude=.git ../site-build/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Deploy website from $GITHUB_SHA"
          git push origin HEAD:main

  deploy-worker:
    name: Deploy Worker
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: cloudflare-worker-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        run: pnpm -F @has-a-computer/worker run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
